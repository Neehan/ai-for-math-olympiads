model_list:
  - model_name: gpt-5.4
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.4
      # Claude Agent SDK supplies list-valued Anthropic system content. The
      # pinned compatibility image safely folds it into the first user turn.
      supports_system_message: false

  - model_name: gpt-5.6-luna
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.6-luna
      # Keep the same Claude Agent SDK compatibility path as GPT-5.4.
      supports_system_message: false

router_settings:
  # Canonical experiments permit exactly one upstream inference request. A
  # failed request can consume compute without returning usage, so retries
  # would violate token matching. Keep LiteLLM's transport windows aligned
  # with the one-hour Claude SDK/CLI window.
  num_retries: 0
  timeout: 3600
  stream_timeout: 3600

general_settings:
  # This authenticates callers to the local proxy. Each sidecar's distinct
  # ChatGPT OAuth credential lives in its private Docker volume.
  master_key: os.environ/LITELLM_MASTER_KEY
