[project]
name = "recognition-is-the-wall"
version = "0.1.0"
description = "Harnesses for diagnosing LLM failure on novel olympiad math"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.56",
    "anyio>=4.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "sympy>=1.12",
    "scipy>=1.11",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.setuptools]
packages = ["src"]
